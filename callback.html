<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特斯拉授权回调</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f6f7f9; color: #1a1b1e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 520px; background: #fff; border: 1px solid #e6e8eb;
    border-radius: 14px; padding: 28px 26px 24px;
  }
  h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  p.sub { margin: 0 0 20px; font-size: 13px; line-height: 1.6; color: #6b7280; }
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.5; background: #f6f7f9; border: 1px solid #e6e8eb;
    border-radius: 9px; padding: 13px 14px; word-break: break-all; user-select: all;
    max-height: 132px; overflow: auto;
  }
  button {
    margin-top: 14px; width: 100%; padding: 11px; font-size: 14px; font-weight: 500;
    color: #fff; background: #185fa5; border: 0; border-radius: 9px; cursor: pointer;
  }
  button:active { background: #0c447c; }
  .hint { margin-top: 16px; font-size: 12px; line-height: 1.7; color: #6b7280; }
  .hint b { color: #374151; font-weight: 500; }
  .bad { display: none; }
  .bad show { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>授权已完成</h1>
  <p class="sub">把下面这一整段复制回电脑上的终端，令牌就会自动保存。这段内容只能用一次，不要发给别人。</p>
  <div class="code" id="out">读取中…</div>
  <button id="copy">复制</button>
  <div class="hint" id="hint">
    <b>怎么用：</b>在项目目录执行<br>
    <code>python setup_tools.py code '刚才复制的内容'</code>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const err = params.get("error");
  const out = document.getElementById("out");
  const hint = document.getElementById("hint");
  if (err) {
    out.textContent = "授权失败：" + err + (params.get("error_description") ? "\n" + params.get("error_description") : "");
  } else if (code) {
    out.textContent = code;
  } else {
    out.textContent = "地址里没有 code，检查回调地址是否登记正确。";
  }
  document.getElementById("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(out.textContent);
      document.getElementById("copy").textContent = "已复制";
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents(out);
      getSelection().removeAllRanges();
      getSelection().addRange(range);
    }
  });
</script>
</body>
</html>
